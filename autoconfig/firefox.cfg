// Firefox reads this file with the FIRST LINE SKIPPED. Keep this comment here.
//
// Tab keybindings, bound at the browser level.
//
// ── Why not Vimium ──────────────────────────────────────────────────────────
// These bindings used to live in vimium-settings.json. Vimium is a content
// script, so it is not running on chrome:// or about: pages, addons.mozilla.org,
// view-source:, the PDF viewer, or while focus is in the address bar. That last
// pair matters here more than usual: user.js sets the new tab to
// chrome://browser/content/blanktab.html, so *every fresh tab* was a page where
// the tab keys did nothing. A <key> in the browser's own keyset has none of
// those holes — it is the same mechanism Ctrl+T and Ctrl+W come through.
//
// ── Why Super, and not Alt ──────────────────────────────────────────────────
// i3 is the window manager and its $mod is Mod1 = Alt (~/.i3rc/config), which
// owns Alt+h/j/k/l (focus) and Alt+1..9 (workspaces). i3 grabs those at the X
// level, so Firefox never sees them — which is also why Firefox's own
// key_selectTab1..8 (modifiers="alt") have been dead on this machine all along.
// Mod4/Super is bound to nothing, in i3 or anywhere else, so it is free.
//
// On Linux the Super key arrives as `meta` (Gecko folded the old `os` modifier
// into `meta`), which is what modifiers="meta" below matches. If a Super binding
// ever stops registering after a Firefox update, that mapping is the thing to
// re-check first.
//
// ── What this binds ─────────────────────────────────────────────────────────
//   Super+l / Super+h    next / previous tab, wrapping at the ends
//   Super+k / Super+j    forward / back in this tab's history
//   Super+1 … Super+8    tab 1..8
//   Super+9              last tab
//   Ctrl+d               duplicate the current tab
//
// Horizontal moves between tabs, vertical moves through history — so h/j/k/l is
// the whole navigation set on one hand and neither pair shadows the other.
//
// ── The peek ────────────────────────────────────────────────────────────────
// The chrome is hidden, so a tab switch showed you nothing. Each navigation key
// sets `ble-peek` on the root element for ble.keys.peekMs (default 1000, 0 off);
// userChrome.css does the unfolding. Matched by COMMAND id, not key id, so a
// Super+j at the end of the history — a disabled command — flashes nothing.
//
// Closing a tab peeks too — it lands you on a neighbour unannounced — but off
// the TabClose event rather than a command id; see the listener in install().
//
// Ctrl+d COSTS YOU "bookmark this page", which Firefox binds to that chord.
// Two <key>s claiming one chord resolve in an order nothing documents, so the
// built-in is removed rather than shadowed (FREED_KEYS below). Bookmarking is
// still on the star button, the Bookmarks menu and Ctrl+Shift+O. To get Ctrl+d
// back, drop the ble_key_duplicateTab row and the FREED_KEYS entry.
//
// ── Shape of the code ───────────────────────────────────────────────────────
// Deliberately the same architecture the browser itself uses in
// browser-sets.js: <key> elements carry no handler of their own, and one
// delegated "command" listener on the keyset switches on the id that fired.
// Firefox's shipped <command id="Browser:NextTab" /> is likewise attribute-free.
// So keys that map onto an existing command just name it and need no code here;
// only "select tab N" does, because Firefox dispatches that one off the key's
// own id (key_selectTab1…) and those ids are already taken.
//
// ── If a chord stops working ────────────────────────────────────────────────
// Check ble.keys.windowsPatched in about:config: it counts the windows this
// file has patched since the browser started. Fewer than the number of windows
// open means install() is not reaching some of them — which is exactly the bug
// that put the two hooks at the bottom of this file here, when only
// browser-delayed-startup-finished was used and Ctrl+N windows came up without
// any of these keys. ble.keys.lastError holds anything this file threw.
//
// A chord that reaches *web content* is proof the key is not installed in that
// window: every <key> below is reserved="true", so a live one never gets past
// chrome. Pressing it on a page with a keydown logger is the fastest test.

try {
  // Keys with `command` are dispatched by Firefox's own listener on
  // mainCommandSet. Keys with `index` carry no command attribute, so the command
  // event fires on the key itself, bubbles to mainKeyset, and is handled below —
  // exactly how the built-in key_selectTab1..8 work. index -1 means "last tab".
  //
  // reserved:true keeps the chord out of web content entirely. Without it a page
  // that captures keys (a web IDE, a terminal emulator in a tab, Vimium's own
  // default <c-d>) could swallow the shortcut on that page only, which is the
  // most annoying kind of bug to track down.
  const KEYS = [
    { id: "ble_key_nextTab", key: "l", mods: "meta", command: "Browser:NextTab" },
    { id: "ble_key_prevTab", key: "h", mods: "meta", command: "Browser:PrevTab" },
    // Browser:Back and Browser:Forward ship with disabled="true" and Firefox
    // flips it as the session history changes. A <key> naming a disabled command
    // doesn't fire, so these correctly do nothing at either end of the history —
    // no extra guard needed here.
    { id: "ble_key_goBack", key: "j", mods: "meta", command: "Browser:Back" },
    { id: "ble_key_goForward", key: "k", mods: "meta", command: "Browser:Forward" },
    { id: "ble_key_duplicateTab", key: "d", mods: "accel", command: "Browser:DuplicateTab" },
    { id: "ble_key_selectTab1", key: "1", mods: "meta", index: 0 },
    { id: "ble_key_selectTab2", key: "2", mods: "meta", index: 1 },
    { id: "ble_key_selectTab3", key: "3", mods: "meta", index: 2 },
    { id: "ble_key_selectTab4", key: "4", mods: "meta", index: 3 },
    { id: "ble_key_selectTab5", key: "5", mods: "meta", index: 4 },
    { id: "ble_key_selectTab6", key: "6", mods: "meta", index: 5 },
    { id: "ble_key_selectTab7", key: "7", mods: "meta", index: 6 },
    { id: "ble_key_selectTab8", key: "8", mods: "meta", index: 7 },
    { id: "ble_key_selectLastTab", key: "9", mods: "meta", index: -1 },
  ];

  // Built-in keys removed to free their chord. See the Ctrl+d note above.
  const FREED_KEYS = ["addBookmarkAsKb"];

  // Browser:DuplicateTab is deliberately absent — it lands you on a copy of the
  // page you were already looking at, so there is nothing to be told.
  const PEEK_COMMANDS = new Set([
    "Browser:NextTab",
    "Browser:PrevTab",
    "Browser:Back",
    "Browser:Forward",
  ]);
  const PEEK_PREF = "ble.keys.peekMs";
  const PEEK_DEFAULT_MS = 1000;

  // The pref is read per press, so about:config applies from the next keystroke.
  // The timer is per window, and re-pressing restarts it rather than stacking.
  function peek(win) {
    let ms = PEEK_DEFAULT_MS;
    try {
      ms = Services.prefs.getIntPref(PEEK_PREF, PEEK_DEFAULT_MS);
    } catch (e) {
      // A malformed pref must not cost you the keybinding it decorates.
    }
    if (!(ms > 0)) {
      return;
    }
    const root = win.document.documentElement;
    root.setAttribute("ble-peek", "true");
    if (win._blePeekTimer) {
      win.clearTimeout(win._blePeekTimer);
    }
    win._blePeekTimer = win.setTimeout(() => {
      win._blePeekTimer = 0;
      root.removeAttribute("ble-peek");
    }, ms);
  }

  // Bumped once per window actually patched, and mirrored into
  // ble.keys.windowsPatched (about:config). That pref is the only way to tell
  // "install() never ran here" apart from "it ran and the chord is being eaten"
  // without a Browser Toolbox — the two look identical from the keyboard.
  let patched = 0;

  function install(win) {
    const doc = win.document;
    // Every hook below can hand us something that isn't a browser window — the
    // window watcher sees dialogs, the PiP player and the Library. Checking the
    // document URI is cheaper and more honest than probing for gBrowser.
    if (doc.documentURI !== "chrome://browser/content/browser.xhtml") {
      return;
    }
    const keyset = doc.getElementById("mainKeyset");
    // The id check makes this safe to run twice on one window, which it will be:
    // the two hooks below deliberately overlap.
    if (!keyset || doc.getElementById(KEYS[0].id)) {
      return;
    }

    for (const id of FREED_KEYS) {
      doc.getElementById(id)?.remove();
    }

    for (const k of KEYS) {
      const el = doc.createXULElement("key");
      el.setAttribute("id", k.id);
      el.setAttribute("key", k.key);
      el.setAttribute("modifiers", k.mods);
      el.setAttribute("reserved", "true");
      if (k.command) {
        el.setAttribute("command", k.command);
      }
      keyset.appendChild(el);
    }

    keyset.addEventListener("command", event => {
      const hit = KEYS.find(k => k.id === event.target.id);
      if (hit && hit.index !== undefined) {
        win.gBrowser.selectTabAtIndex(hit.index, event);
        peek(win);
      }
    });

    // Keys naming a shipped command dispatch on the <command> in mainCommandSet,
    // not on the <key>, so they never reach the listener above. install() runs at
    // most once per window, so this one is never doubled.
    doc.addEventListener("command", event => {
      if (PEEK_COMMANDS.has(event.target?.id)) {
        peek(win);
      }
    }, true);

    // Every close — Ctrl+w, Ctrl+F4, middle click, the X, the context menu,
    // Vimium's x — bubbles a TabClose; a detached tab sets adoptedBy. See README.
    doc.addEventListener("TabClose", event => {
      if (!event.detail?.adoptedBy) {
        peek(win);
      }
    });

    // Gecko compiles a window's <key> elements into a cached handler chain and
    // does not watch for later appends. Re-inserting the keyset is the known
    // way to force that rebuild; without it a window whose chain was already
    // built ignores everything added above — the keys are in the DOM, look
    // perfectly correct in the inspector, and simply never fire.
    keyset.parentNode.appendChild(keyset);

    patched++;
    Services.prefs.setIntPref("ble.keys.windowsPatched", patched);
  }

  // Two hooks, on purpose — install() is idempotent and whichever fires first
  // wins.
  //
  // domwindowopened + load is the one that matters. It catches a window as soon
  // as its DOM exists, by the only route every chrome window must take, whether
  // it came from startup, `firefox --new-window`, Ctrl+N, a target=_blank popup
  // or session restore. It also lands *before* the first keypress can compile
  // the handler chain, which the delayed-startup hook alone did not reliably do.
  //
  // browser-delayed-startup-finished (browser-init.js) is kept as the backstop
  // for anything the window watcher misses.
  const observer = {
    observe(subject, topic) {
      if (topic === "domwindowopened") {
        subject.addEventListener("load", () => install(subject), { once: true });
      } else {
        install(subject);
      }
    },
  };
  Services.ww.registerNotification(observer);
  Services.obs.addObserver(observer, "browser-delayed-startup-finished");

  // Nothing is open when autoconfig runs, so this is a no-op at startup. It is
  // here so the file stays correct if it is ever re-run by hand from the Browser
  // Toolbox while windows exist — which is how you test a change to it without
  // restarting the browser.
  for (const win of Services.wm.getEnumerator("navigator:browser")) {
    install(win);
  }
} catch (e) {
  Services.prefs.setStringPref("ble.keys.lastError", String(e));
  // Anything thrown here is silent otherwise: the browser just comes up without
  // the bindings. This puts it in the Browser Console (Ctrl+Shift+J).
  Components.utils.reportError(e);
}
