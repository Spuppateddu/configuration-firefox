# The add-on catalogue. install.sh turns the selected rows into Firefox's
# enterprise policy (/etc/firefox/policies/policies.json, normal_installed).
#
# Format: id|amo-slug|label|default
#   id       the extension ID (about:debugging); slug the AMO one, also the name
#   default  --extensions= takes. 1 = pre-ticked, 0 = off. Optional, defaults 1.
#
# install.sh asks which of these to install, as a checkbox list, unless it was
# given --extensions=slug,slug — which is what best-linux-environment's
# ./setup.sh does, having asked the same list up front, so you aren't asked
# twice. Either way the answer is kept in ~/.cache/firefox-config/extensions and
# re-used at boot. Unticking never uninstalls — the policy just stops declaring it.
#
# Bitwarden and Wappalyzer default off: they carry an account or a licence, not
# configuration. Their toolbar placements are in user.js either way (ignored).
